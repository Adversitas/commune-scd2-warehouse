name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Full build on the real INSEE COG 2023-2025 (contracts gate the job)
        run: cogwh build --db ci.duckdb --reports ci-reports
      - name: Point-in-time queries
        run: |
          cogwh history 16097 --db ci.duckdb
          cogwh asof 2023-06-01 16097 --db ci.duckdb
